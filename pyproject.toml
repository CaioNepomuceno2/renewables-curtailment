[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curtailment"
version = "0.1.0"
description = "Constrained-off de usinas eólicas e solares no Brasil: quanto se perde, onde, por quê, quanto vale e previsão do dia seguinte (dados abertos do ONS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.1",
  "requests>=2.32",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "holidays>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
